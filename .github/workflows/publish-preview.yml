name: Publish verified Windows preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only this release job receives temporary permission to upload the public
    # verified artifact. No Apple account or persistent credential is used.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: EmuWindows-starter
          run-id: 37399344715
          github-token: ${{ github.token }}
          path: downloads
      - name: Publish only checksum-matching public preview files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m tools.publish_preview --starter downloads/EmuWindows-starter.zip --repository "${{ github.repository }}"
